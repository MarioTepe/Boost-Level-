<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Nuevo producto | Boost Level Admin</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/formularios.css">
</head>

<body class="admin-body">

<div class="admin-layout">

  <aside class="admin-sidebar">

    <a href="../index.html" class="admin-logo">

      <img
        src="../img/icono-boost-limpio.png"
        alt="Boost Level"
        width="52"
        height="52">

      <span>BOOST LEVEL</span>

    </a>

    <div class="admin-menu">

      <a class="admin-link" href="index.html">
        Inicio
      </a>

      <a class="admin-link" href="productos.html">
        Productos
      </a>

      <a class="admin-link active" href="nuevo-producto.html">
        Nuevo producto
      </a>

      <a class="admin-link" href="usuarios.html">
        Usuarios
      </a>

      <a class="admin-link" href="nuevo-usuario.html">
        Nuevo usuario
      </a>

      <a class="admin-link" href="../index.html">
        Volver a tienda
      </a>

    </div>

  </aside>


  <main class="admin-content">

    <h1>Nuevo producto</h1>

    <p class="text-muted-custom">
      Formulario con validaciones JavaScript.
    </p>


    <form
      id="formProducto"
      class="panel"
      novalidate>


      <div class="row">


        <div class="col-md-6 mb-3">

          <label
            for="codigo"
            class="form-label">
            Código producto
          </label>

          <input
            id="codigo"
            class="form-control"
            type="text">

          <p
            id="errorCodigo"
            class="error">
          </p>

        </div>


        <div class="col-md-6 mb-3">

          <label
            for="nombre"
            class="form-label">
            Nombre
          </label>

          <input
            id="nombre"
            class="form-control"
            type="text"
            maxlength="100">

          <p
            id="errorNombre"
            class="error">
          </p>

        </div>


        <div class="col-12 mb-3">

          <label
            for="descripcion"
            class="form-label">
            Descripción
          </label>

          <textarea
            id="descripcion"
            class="form-control"
            maxlength="500"
            rows="4"></textarea>

          <p
            id="errorDescripcion"
            class="error">
          </p>

        </div>


        <div class="col-md-6 mb-3">

          <label
            for="precio"
            class="form-label">
            Precio
          </label>

          <input
            id="precio"
            class="form-control"
            type="number"
            min="0"
            step="0.01">

          <p
            id="errorPrecio"
            class="error">
          </p>

        </div>


        <div class="col-md-6 mb-3">

          <label
            for="stock"
            class="form-label">
            Stock
          </label>

          <input
            id="stock"
            class="form-control"
            type="number"
            min="0"
            step="1">

          <p
            id="errorStock"
            class="error">
          </p>

        </div>


        <div class="col-md-6 mb-3">

          <label
            for="stockCritico"
            class="form-label">
            Stock crítico
          </label>

          <input
            id="stockCritico"
            class="form-control"
            type="number"
            min="0"
            step="1">

          <p
            id="errorStockCritico"
            class="error">
          </p>

          <p
            id="alertaStock"
            class="error">
          </p>

        </div>


        <div class="col-md-6 mb-3">

          <label
            for="categoria"
            class="form-label">
            Categoría
          </label>

          <select
            id="categoria"
            class="form-select">

            <option value="">
              Seleccione
            </option>

            <option>
              Juegos de Mesa
            </option>

            <option>
              Accesorios
            </option>

            <option>
              Monitor
            </option>

            <option>
              Consolas
            </option>

            <option>
              Computadores Gamers
            </option>

            <option>
              Sillas Gamers
            </option>

            <option>
              Mouse
            </option>

            <option>
              Mousepad
            </option>

            <option>
              Poleras Personalizadas
            </option>

          </select>

          <p
            id="errorCategoria"
            class="error">
          </p>

        </div>


      </div>


      <button
        class="btn btn-neon"
        type="submit">
        Guardar producto
      </button>


    </form>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/producto-form.js"></script>

</body>

</html>
