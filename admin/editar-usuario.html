<!doctype html>
    <html lang="es">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Editar usuario | Boost Level Admin</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="../css/style.css">
      <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/formularios.css">
</head>
    <body class="admin-body">

<div class="admin-layout">

    <aside class="admin-sidebar">
      <a href="../index.html" class="admin-logo">
        <img src="../img/icono-boost-limpio.png" alt="Boost Level" width="52" height="52">
        <span>BOOST LEVEL</span>
      </a>
      <div class="admin-menu">
        <a class="admin-link " href="index.html">Inicio</a><a class="admin-link " href="productos.html">Productos</a><a class="admin-link " href="nuevo-producto.html">Nuevo producto</a><a class="admin-link active" href="usuarios.html">Usuarios</a><a class="admin-link " href="nuevo-usuario.html">Nuevo usuario</a><a class="admin-link " href="../index.html">Volver a tienda</a>
      </div>
    </aside>

  <main class="admin-content">
    <h1>Editar usuario</h1>
    <form id="formUsuario" class="panel" data-modo="editar" data-destino="usuarios.html" novalidate>

<div class="row">
  <div class="col-md-6 mb-3">
    <label for="run" class="form-label">RUN</label>
    <input id="run" class="form-control" type="text" maxlength="9" placeholder="123456785">
    <p id="errorRun" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input id="nombre" class="form-control" type="text" maxlength="50">
    <p id="errorNombre" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="apellidos" class="form-label">Apellidos</label>
    <input id="apellidos" class="form-control" type="text" maxlength="100">
    <p id="errorApellidos" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="correo" class="form-label">Correo</label>
    <input id="correo" class="form-control" type="text" maxlength="100">
    <p id="errorCorreo" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
    <input id="fechaNacimiento" class="form-control" type="date">
    <p id="errorFecha" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="password" class="form-label">Contraseña</label>
    <input id="password" class="form-control" type="password" maxlength="10">
    <p id="errorPassword" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="repetirPassword" class="form-label">Repetir contraseña</label>
    <input id="repetirPassword" class="form-control" type="password" maxlength="10">
    <p id="errorRepetir" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="region" class="form-label">Región</label>
    <select id="region" class="form-select"></select>
    <p id="errorRegion" class="error"></p>
  </div>
  <div class="col-md-6 mb-3">
    <label for="comuna" class="form-label">Comuna</label>
    <select id="comuna" class="form-select">
      <option value="">Seleccione una comuna</option>
    </select>
    <p id="errorComuna" class="error"></p>
  </div>
  <div class="col-12 mb-3">
    <label for="direccion" class="form-label">Dirección</label>
    <input id="direccion" class="form-control" type="text" maxlength="300">
    <p id="errorDireccion" class="error"></p>
  </div>
</div>

      <div class="row">
<div class="col-md-6 mb-3">
  <label for="tipoUsuario" class="form-label">Tipo de usuario</label>
  <select id="tipoUsuario" class="form-select">
    <option>Administrador</option>
    <option>Cliente</option>
    <option>Vendedor</option>
  </select>
</div>
</div>
      <button class="btn btn-neon" type="submit">Guardar cambios</button>
    </form>
  </main>
</div>
<script>
  document.querySelector("#run").value = "123456785";
  document.querySelector("#nombre").value = "Usuario";
  document.querySelector("#apellidos").value = "Demo";
  document.querySelector("#correo").value = "usuario@gmail.com";
  document.querySelector("#direccion").value = "Dirección de ejemplo 123";
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/regiones.js"></script>
<script src="../js/usuario-form.js"></script>
    </body>
    </html>
