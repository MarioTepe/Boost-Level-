<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Productos | Boost Level Admin</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>

<body class="admin-body">

<div class="admin-layout">

  <aside class="admin-sidebar">

    <a href="../index.html" class="admin-logo">
      <img
        src="../img/icono-boost-limpio.png"
        alt="Boost Level"
        width="52"
        height="52">

      <span>BOOST LEVEL</span>
    </a>

    <div class="admin-menu">

      <a class="admin-link" href="index.html">
        Inicio
      </a>

      <a class="admin-link active" href="productos.html">
        Productos
      </a>

      <a class="admin-link" href="nuevo-producto.html">
        Nuevo producto
      </a>

      <a class="admin-link" href="usuarios.html">
        Usuarios
      </a>

      <a class="admin-link" href="nuevo-usuario.html">
        Nuevo usuario
      </a>

      <a class="admin-link" href="../index.html">
        Volver a tienda
      </a>

    </div>

  </aside>


  <main class="admin-content">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">

      <div>
        <h1>Productos</h1>

        <p class="text-muted-custom mb-0">
          Listado administrativo.
        </p>
      </div>

      <a
        href="nuevo-producto.html"
        class="btn btn-neon">

        Nuevo producto

      </a>

    </div>


    <div class="table-responsive panel p-0">

      <table class="table table-dark-custom table-hover mb-0 align-middle">

        <thead>

          <tr>

            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>

          </tr>

        </thead>


        <tbody id="tablaProductos"></tbody>


      </table>

    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/datos.js"></script>

<script src="../js/admin-productos.js"></script>


</body>

</html>
