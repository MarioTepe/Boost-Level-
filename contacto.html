<main class="container py-5">

    <form id="formContacto" class="panel" novalidate>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input id="nombre" class="form-control" type="text" maxlength="100">
        <p id="errorNombre" class="error"></p>
      </div>
      <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input id="correo" class="form-control" type="text" maxlength="100">
        <p id="errorCorreo" class="error"></p>
      </div>
      <div class="mb-3">
        <label for="comentario" class="form-label">Comentario</label>
        <textarea id="comentario" class="form-control" rows="6" maxlength="500"></textarea>
        <p id="errorComentario" class="error"></p>
      </div>
      <button class="btn btn-neon" type="submit">Enviar mensaje</button>
    </form>
